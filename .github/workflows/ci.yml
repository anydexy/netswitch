# Тесты на Windows и macOS и проверка NetSwitch на настоящем macOS (mac-smoke.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false
      - run: go vet ./...
      - run: go test ./...

  mac-smoke:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false
      - name: Сборка
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/NetSwitch" .
      - name: DNS, исключения, zapret, TG WS Proxy
        run: bash .github/scripts/mac-smoke.sh "$RUNNER_TEMP/NetSwitch"
